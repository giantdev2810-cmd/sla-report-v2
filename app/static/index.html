<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>SLA report</title>
<style>body{font:16px system-ui;max-width:1200px;margin:2rem auto;padding:0 1rem;color:#17263c}form{display:flex;gap:1rem;flex-wrap:wrap}table{border-collapse:collapse;width:100%;margin:1rem 0}th,td{border:1px solid #ccd5df;padding:.5rem;text-align:left}th{background:#eef3f8}#status{padding:1rem;background:#eef3f8}.scroll{overflow:auto}button,input{font:inherit;padding:.4rem}h2{margin-top:2rem}</style></head>
<body><h1>SLA report</h1><form id="f"><label>From <input type="date" name="from" required></label><label>To <input type="date" name="to" required></label><button>Run report</button></form>
<p id="status" role="status">Choose a date range to load a report.</p><h2>Requests</h2><div class="scroll"><table id="requests"></table></div><h2>Responders</h2><div class="scroll"><table id="responders"></table></div>
<script>
const statusBox = document.getElementById('status');
function render(id, rows, columns) {
  const table = document.getElementById(id);
  table.replaceChildren();
  const head = document.createElement('thead');
  const heading = document.createElement('tr');
  for (const [key, label] of columns) {
    const th = document.createElement('th');
    th.textContent = label;
    heading.append(th);
  }
  head.append(heading);
  table.append(head);
  const body = document.createElement('tbody');
  for (const row of rows) {
    const tr = document.createElement('tr');
    for (const [key] of columns) {
      const td = document.createElement('td');
      td.textContent = row[key] === null ? '—' : String(row[key]);
      tr.append(td);
    }
    body.append(tr);
  }
  table.append(body);
}
document.getElementById('f').addEventListener('submit', async event => {
  event.preventDefault();
  const form = event.target;
  const button = form.querySelector('button');
  button.disabled = true;
  statusBox.textContent = 'Loading report. The first load may take several minutes.';
  document.getElementById('requests').replaceChildren();
  document.getElementById('responders').replaceChildren();
  try {
    const response = await fetch('/api/sla-report?' + new URLSearchParams(new FormData(form)));
    const data = await response.json();
    if (!response.ok) {
      throw new Error(response.status === 400 ? 'Enter a valid date range.' :
                      'The report could not be loaded. Please try again later.');
    }
    render('requests', data.requests, [
      ['id', 'ID'], ['site_id', 'Site'], ['responder', 'Responder'],
      ['response_business_minutes', 'Business minutes'],
      ['within_target', 'Within target'], ['completed_late', 'Completed late']
    ]);
    render('responders', data.responders, [
      ['id', 'ID'], ['name', 'Name'], ['requests', 'Requests'],
      ['within_target', 'Within target'], ['completed_late', 'Completed late']
    ]);
    statusBox.textContent = data.requests.length ? data.requests.length + ' requests loaded.' :
                            'No matching requests.';
  } catch (error) {
    statusBox.textContent = error.message === 'Failed to fetch' ?
      'Unable to connect to the report service.' : error.message;
  } finally {
    button.disabled = false;
  }
});
</script></body></html>
